name: Build Echo Trails Mod

on:
  workflow_dispatch:   # ← Можно запускать вручную из GitHub
  push:
    branches:
      - main
      - master
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Windows

          - name: macOS
            os: macos-latest
            target: macOS

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ← Вот твой добавленный шаг для фикса local changes в SDK
      - name: Reset Geode SDK if local changes
        if: runner.os == 'Linux'  # Обычно проблема возникает на ubuntu-latest (Android)
        run: |
          if [ -d "geode-sdk-clone" ]; then
            cd geode-sdk-clone
            git fetch origin
            git reset --hard HEAD
            git clean -fd
            git pull origin HEAD || true
            echo "Geode SDK reset and updated"
          else
            echo "geode-sdk-clone not found, skipping reset"
          fi

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          combine: true          # Объединяет все платформы в один .geode (рекомендуется)
          target: ${{ matrix.config.target }}  # Для каждой платформы

  package:
    name: Package & Upload Artifacts
    runs-on: ubuntu-latest
    needs: build   # Ждём завершения всех билдов

    steps:
      - name: Checkout repository (for combine step)
        uses: actions/checkout@v4

      # Если combine: true в build, то artifacts уже готовы
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mod-build-*   # Или имя из твоего action (если отличается)
          path: builds/
          merge-multiple: true

      - name: Combine builds (if not already combined)
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine
        with:
          input-directory: builds/

      - name: Upload combined .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-trails-geode
          path: ${{ steps.combine.outputs.build-output || 'builds/*.geode' }}
          if-no-files-found: warn

      # Автоматический релиз при теге (например, git tag v1.0.0 && git push --tags)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.combine.outputs.build-output || 'builds/*.geode' }}
          generate_release_notes: true
          draft: false
